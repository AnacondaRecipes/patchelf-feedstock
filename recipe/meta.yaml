{% set version = "0.15.0" %}
{% set checksum = "5d1eda9bad4439bb9c0a87fcba198d7c0d372f361e77de41d68d6308062e5000" %}
{% set build = "0" %}

package:
  name: patchelf
  version: {{ version }}

source:
  url: https://github.com/NixOS/patchelf/archive/refs/tags/{{ version }}.tar.gz
  sha256: {{ checksum }}
  patches:
    - patches/0001-build-id.patch
    - patches/0002-remove-broken-test-r-path.patch

build:
  number: 0
  skip: true  # [win]
  script: build.sh  # [win]
  binary_relocation: false

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - m2w64-toolchain  # [win]
    - patch  # [unix]
    - m2-patch  # [win]
    - make  # [unix]
    - m2-make  # [win]
    - automake
    - autoconf

test:
  commands:
    - bash -c '[[ "$(patchelf --version)" =~ "patchelf {{ version }}".* ]]'  # [unix]
    - patchelf --version  # [win]

about:
  home: https://nixos.org/patchelf.html
  license: GPL-3.0-or-later
  license_file: COPYING
  summary: A small utility to modify the dynamic linker and RPATH of ELF executables.
  description: |
    PatchELF is a small utility to modify the dynamic linker and RPATH of ELF
    executables.
  doc_url: https://nixos.org/patchelf.html
  dev_url: https://github.com/NixOS/patchelf

extra:
  recipe-maintainers:
    - jakirkham
    - mjuric
