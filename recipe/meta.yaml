{% set version = "0.15.0" %}
{% set checksum = "f4036d3ee4d8e228dec1befff0f6e46d8a40e9e570e0068e39d77e62e2c8bdc2" %}
{% set build = "0" %}

package:
  name: patchelf
  version: {{ version }}

source:
  url: https://github.com/NixOS/patchelf/releases/download/{{ version }}/patchelf-{{ version }}.tar.bz2
  sha256: {{ checksum }}
  patches:
    - patches/0001-build-id.patch
    - patches/0002-remove-broken-test-r-path.patch

build:
  number: 0
  skip: true  # [win]
  script: build.sh  # [win]
  binary_relocation: false

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - m2w64-toolchain  # [win]
    - patch  # [unix]
    - m2-patch  # [win]
    - make  # [unix]
    - m2-make  # [win]
    - automake
    - autoconf
    - libtool
    - m4
    # needed for tests
    - binutils  # [not (win or osx)]

test:
  commands:
    - bash -c '[[ "$(patchelf --version)" =~ "patchelf {{ version }}".* ]]'  # [unix]
    - patchelf --version  # [win]

about:
  home: https://github.com/NixOS/patchelf
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: COPYING
  summary: A small utility to modify the dynamic linker and RPATH of ELF executables.
  description: |
    PatchELF is a small utility to modify the dynamic linker and RPATH of ELF
    executables.
  doc_url: https://github.com/NixOS/patchelf/blob/master/README.md
  dev_url: https://github.com/NixOS/patchelf

extra:
  recipe-maintainers:
    - jakirkham
    - mjuric
